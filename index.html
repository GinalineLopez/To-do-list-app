<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #120720 !important;
            font-family: sans-serif;
            color: white;
        }
        .purple-card {
            background-color: #1d0d30 !important;
            border: 1px solid #8a2be2 !important;
            border-radius: 12px;
        }
        .border-purple-accent {
            border-color: #8a2be2 !important;
        }
        .shadow-aesthetic {
            box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.2);
        }
        .dropdown-purple {
            background-color: #120720 !important;
            color: white !important;
            border: 1px solid #8a2be2 !important;
        }
        .blink-animation {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <header class="d-flex justify-content-between align-items-center mb-5 mt-2">
            <h1 class="fw-bold text-white mb-0">📌 Task Planner & Reminder</h1>
            <small class="text-white-50">Purple Tracker By Ginaline Lopez</small>
        </header>

        <div id="notificationArea" class="mb-4"></div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card purple-card text-white p-4 shadow-aesthetic">
                    <h3 class="mb-4 fw-bold">Add New Plan</h3>
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Task / Plan</label>
                            <input type="text" class="form-control dropdown-purple" id="taskTitle" required placeholder="e.g., Submit Project">
                        </div>
                        <div class="mb-3">
                            <label for="taskDeadline" class="form-label">Deadline (Date & Time)</label>
                            <input type="datetime-local" class="form-control dropdown-purple" id="taskDeadline" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskOffset" class="form-label">Trigger Alarm Early?</label>
                            <select class="form-select dropdown-purple" id="taskOffset">
                                <option value="0">Exactly on time</option>
                                <option value="5">5 minutes early</option>
                                <option value="60">1 hour early</option>
                                <option value="1440">1 day early</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="taskTone" class="form-label">Select Notification Tone</label>
                            <select class="form-select dropdown-purple" id="taskTone">
                                <option value="dferun-ethereal-breeze-332384.mp3">Ethereal Breeze Tone</option>
                                <option value="giazalea-alarm-21264.mp3">Giazalea Alarm Tone</option>
                                <option value="u_tj8wl5z0vw-itrippin-alarm-496913.mp3">iTrippin Alarm Tone</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-outline-light w-100 fw-bold mt-2" style="background: rgba(138, 43, 226, 0.2); border-color: #8a2be2;">Add to List</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card purple-card text-white p-4 shadow-aesthetic">
                    <h3 class="mb-4 fw-bold">My Upcoming Plans</h3>
                    <ul class="list-group" id="taskList">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="alarmModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="alarmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content purple-card text-white border border-danger border-2 shadow-aesthetic">
                <div class="modal-body text-center p-5">
                    <h1 class="blink-animation text-danger mb-4">🚨 Early Reminder Alert!</h1>
                    <h2 id="alarmTaskTitle" class="fw-bold mb-3">Task Title</h2>
                    <p id="alarmModalTime" class="text-warning mb-4">Deadline Details</p>
                    <button type="button" class="btn btn-warning btn-lg w-100 fw-bold rounded-pill py-3" id="dismissAlarmBtn">Dismiss Alarm</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content purple-card text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Cancel Scheduled Event?</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white-50 py-2">
                    Are you sure you want to remove this plan from your sync record? This action cannot be undone.
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Keep Plan</button>
                    <button type="button" class="btn btn-danger btn-sm px-3" id="confirmDeleteBtn">Yes, Remove</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
