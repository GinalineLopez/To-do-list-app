<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* YOUR EXACT ORIGINAL COLOR THEME & STYLES */
        body {
            background-color: #120720 !important;
            font-family: sans-serif;
        }
        .purple-card {
            background-color: #1d0d30 !important;
            border: 1px solid #8a2be2 !important;
        }
        .border-purple-accent {
            border-color: #8a2be2 !important;
        }
        .shadow-aesthetic {
            box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.2);
        }
        .dropdown-purple {
            background-color: #120720 !important;
            color: white !important;
            border: 1px solid #8a2be2 !important;
        }
        .blink-animation {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* NEW SLIDE CONTROLS (Keeps everything clean on one screen) */
        .app-slide {
            display: none; 
        }
        .active-slide {
            display: block !important;
        }

        /* BOTTOM NAVBAR (Styled to perfectly match your dark purple theme) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #0b0414;
            border-top: 1px solid #8a2be2;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1030;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #a5a5a5;
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            width: 33%;
            padding: 5px 0;
        }
        .nav-item.active-nav {
            color: #8a2be2;
            font-weight: bold;
        }
        .badge-notify {
            position: absolute;
            top: -5px;
            right: -10px;
            font-size: 10px;
        }
        body {
            padding-bottom: 80px; /* Prevents nav bar from blocking content */
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <div id="notificationArea" class="mb-4"></div>

        <div id="slide-add" class="app-slide active-slide">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card purple-card text-white p-4 shadow-aesthetic">
                        <h3 class="mb-4 text-center fw-bold">Smart Todo App</h3>
                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskTitle" class="form-label">Task Title</label>
                                <input type="text" class="form-control dropdown-purple" id="taskTitle" required placeholder="Enter task title">
                            </div>
                            <div class="mb-3">
                                <label for="taskDeadline" class="form-label">Deadline</label>
                                <input type="datetime-local" class="form-control dropdown-purple" id="taskDeadline" required>
                            </div>
                            <div class="mb-3">
                                <label for="taskOffset" class="form-label">Remind Me</label>
                                <select class="form-select dropdown-purple" id="taskOffset">
                                    <option value="0">Exactly on time</option>
                                    <option value="5">5 minutes early</option>
                                    <option value="60">1 hour early</option>
                                    <option value="1440">1 day early</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="taskTone" class="form-label">Notification Tone</label>
                                <select class="form-select dropdown-purple" id="taskTone">
                                    <option value="dferun-ethereal-breeze-332384.mp3">dferun-ethereal-breeze-332384.mp3</option>
                                    <option value="giazalea-alarm-21264.mp3">giazalea-alarm-21264.mp3</option>
                                    <option value="u_tj8wl5z0vw-itrippin-alarm-496913.mp3">u_tj8wl5z0vw-itrippin-alarm-496913.mp3</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-light w-100 fw-bold">Add to List</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="slide-list" class="app-slide">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <h4 class="text-white mb-4 fw-bold">My Upcoming Plans</h4>
                    <ul class="list-group" id="taskList">
                        </ul>
                </div>
            </div>
        </div>

        <div id="slide-ringing" class="app-slide">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="card purple-card text-white p-5 shadow-aesthetic border border-danger border-2">
                        <div id="ringingPlaceholder" class="py-4">
                            <div style="font-size: 50px; opacity: 0.3;">🔇</div>
                            <h5 class="mt-3 text-white-50">No Active Alarms</h5>
                        </div>

                        <div id="activeRingingContent" class="d-none">
                            <h1 class="blink-animation text-danger mb-4">🚨 ALARM RINGING 🚨</h1>
                            <h2 id="alarmTaskTitle" class="fw-bold mb-2">Task Title</h2>
                            <p id="alarmModalTime" class="text-warning mb-5">Deadline details go here</p>
                            <button id="dismissAlarmBtn" class="btn btn-danger btn-lg w-100 fw-bold rounded-pill py-3 shadow">DISMISS REMINDER</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active-nav" onclick="navigateToSlide('slide-add')">
            <div style="font-size: 20px;">➕</div>
            <span>Add Plan</span>
        </button>
        <button class="nav-item" onclick="navigateToSlide('slide-list')">
            <div style="font-size: 20px;">📋</div>
            <span>My List</span>
        </button>
        <button class="nav-item" onclick="navigateToSlide('slide-ringing')">
            <div style="font-size: 20px; position: relative;">
                🔔<span id="navRingingBadge" class="badge rounded-pill bg-danger d-none badge-notify">!</span>
            </div>
            <span>Alarms</span>
        </button>
    </nav>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content purple-card text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Delete Task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white-50">
                    Are you sure you want to delete this task?
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-sm px-3" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>

    <script>
        function navigateToSlide(slideId) {
            // Hide all slides
            document.querySelectorAll('.app-slide').forEach(slide => {
                slide.classList.remove('active-slide');
            });
            // Show selected slide
            document.getElementById(slideId).classList.add('active-slide');

            // Toggle active styling on navigation items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active-nav');
            });
            event.currentTarget.classList.add('active-nav');
        }
    </script>
</body>
</html>
